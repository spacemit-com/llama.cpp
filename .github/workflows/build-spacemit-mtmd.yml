name: CI (SpacemiT MTMD)

on:
  push:
    branches:
      - spacemit-mtmd
  pull_request:
    branches:
      - spacemit-mtmd

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish SpacemiT MTMD
    runs-on: ubuntu-24.04

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load shared variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .github/variables.env
          set +a

          VERSION_NUMBER=$(tr -d '[:space:]' < VERSION_NUMBER)
          if [[ -z "${VERSION_NUMBER}" ]]; then
            echo "error: VERSION_NUMBER is empty" >&2
            exit 1
          fi

          SPACEMIT_MTMD_RELEASE_TAG="v${VERSION_NUMBER}"
          SPACEMIT_MTMD_PACKAGE_NAME="${SPACEMIT_MTMD_PACKAGE_PREFIX}.${VERSION_NUMBER}"

          {
            echo "SPACEMIT_TOOLCHAIN_URL=${SPACEMIT_TOOLCHAIN_URL}"
            echo "SPACEMIT_ORT_URL=${SPACEMIT_ORT_URL}"
            echo "SPACEMIT_MTMD_RELEASE_TAG=${SPACEMIT_MTMD_RELEASE_TAG}"
            echo "SPACEMIT_MTMD_PACKAGE_NAME=${SPACEMIT_MTMD_PACKAGE_NAME}"
            echo "SPACEMIT_TOOLCHAIN_ARCHIVE=${SPACEMIT_TOOLCHAIN_ARCHIVE}"
            echo "SPACEMIT_ORT_ARCHIVE=${SPACEMIT_ORT_ARCHIVE}"
            echo "SPACEMIT_TOOLCHAIN_DIR=${SPACEMIT_TOOLCHAIN_DIR}"
          } >> "$GITHUB_ENV"

          toolchain_cache_key=$(printf '%s' "$SPACEMIT_TOOLCHAIN_URL" | sha256sum | cut -c1-16)
          ort_cache_key=$(printf '%s' "$SPACEMIT_ORT_URL" | sha256sum | cut -c1-16)

          {
            echo "toolchain_url=${SPACEMIT_TOOLCHAIN_URL}"
            echo "ort_url=${SPACEMIT_ORT_URL}"
            echo "version_number=${VERSION_NUMBER}"
            echo "release_tag=${SPACEMIT_MTMD_RELEASE_TAG}"
            echo "package_name=${SPACEMIT_MTMD_PACKAGE_NAME}"
            echo "toolchain_archive=${SPACEMIT_TOOLCHAIN_ARCHIVE}"
            echo "ort_archive=${SPACEMIT_ORT_ARCHIVE}"
            echo "toolchain_dir=${SPACEMIT_TOOLCHAIN_DIR}"
            echo "toolchain_cache_key=${toolchain_cache_key}"
            echo "ort_cache_key=${ort_cache_key}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish a new release
        id: release_guard
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail

          before_commit="${{ github.event.before }}"
          current_commit="${{ github.sha }}"
          release_tag="${{ steps.vars.outputs.release_tag }}"

          if [[ "${before_commit}" == "0000000000000000000000000000000000000000" ]]; then
            before_commit="$(git rev-list --max-count=1 "${current_commit}^" 2>/dev/null || true)"
          fi

          if [[ -z "${before_commit}" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_previous_commit_to_compare" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${before_commit}" "${current_commit}" -- VERSION_NUMBER; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=version_number_unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "refs/tags/${release_tag}")"
            if [[ "${tag_commit}" == "${current_commit}" ]]; then
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "reason=release_already_exists_for_this_commit" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::Release tag ${release_tag} already exists at ${tag_commit}. Bump VERSION_NUMBER before publishing a new release."
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "reason=version_number_changed" >> "$GITHUB_OUTPUT"

      - name: Explain skipped release publish
        if: ${{ github.event_name == 'push' && steps.release_guard.outputs.should_publish != 'true' }}
        shell: bash
        run: |
          echo "Skipping GitHub release publish: ${{ steps.release_guard.outputs.reason }}"

      - name: Cache SpacemiT Toolchain archive
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: ${{ steps.vars.outputs.toolchain_archive }}
          key: spacemit-toolchain-archive-${{ steps.vars.outputs.toolchain_cache_key }}-${{ runner.os }}

      - name: Cache SpacemiT ORT archive
        id: cache-ort
        uses: actions/cache@v5
        with:
          path: ${{ steps.vars.outputs.ort_archive }}
          key: spacemit-ort-archive-${{ steps.vars.outputs.ort_cache_key }}-${{ runner.os }}

      - name: Prepare SpacemiT Toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$SPACEMIT_TOOLCHAIN_ARCHIVE")"
          if [[ ! -f "$SPACEMIT_TOOLCHAIN_ARCHIVE" ]]; then
            curl -L --fail --retry 5 --retry-all-errors \
              -o "$SPACEMIT_TOOLCHAIN_ARCHIVE" \
              "$SPACEMIT_TOOLCHAIN_URL"
          fi

          rm -rf "$SPACEMIT_TOOLCHAIN_DIR"
          mkdir -p "$SPACEMIT_TOOLCHAIN_DIR"
          tar -xJf "$SPACEMIT_TOOLCHAIN_ARCHIVE" -C "$SPACEMIT_TOOLCHAIN_DIR" --strip-components=1

      - name: Prepare SpacemiT ORT
        shell: bash
        run: |
          set -euo pipefail
          ORT_ROOT=third_party/spacemit-ort

          mkdir -p "$(dirname "$SPACEMIT_ORT_ARCHIVE")"
          if [[ ! -f "$SPACEMIT_ORT_ARCHIVE" ]]; then
            curl -L --fail --retry 5 --retry-all-errors \
              -o "$SPACEMIT_ORT_ARCHIVE" \
              "$SPACEMIT_ORT_URL"
          fi

          rm -rf "$ORT_ROOT"
          mkdir -p "$ORT_ROOT"
          tar -xzf "$SPACEMIT_ORT_ARCHIVE" -C "$ORT_ROOT"

          ORT_DIR=$(find "$ORT_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [[ -z "${ORT_DIR}" ]]; then
            ORT_DIR="${PWD}/${ORT_ROOT}"
          else
            ORT_DIR="${PWD}/${ORT_DIR}"
          fi

          if [[ ! -d "${ORT_DIR}/include" || ! -d "${ORT_DIR}/lib" || ! -d "${ORT_DIR}/samples" ]]; then
            echo "error: invalid SPACEMIT_ORT_DIR layout at ${ORT_DIR}" >&2
            find "$ORT_ROOT" -maxdepth 2 -type d | sort
            exit 1
          fi

          echo "SPACEMIT_ORT_DIR=${ORT_DIR}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export RISCV_ROOT_PATH=${PWD}/${SPACEMIT_TOOLCHAIN_DIR}
          if [[ ! -d "${SPACEMIT_ORT_DIR}/include" ]]; then
            echo "error: include directory not found under SPACEMIT_ORT_DIR: ${SPACEMIT_ORT_DIR}/include" >&2
            exit 1
          fi

          if [[ ! -d "${SPACEMIT_ORT_DIR}/lib" ]]; then
            echo "error: lib directory not found under SPACEMIT_ORT_DIR: ${SPACEMIT_ORT_DIR}/lib" >&2
            exit 1
          fi

          if [[ ! -d "${SPACEMIT_ORT_DIR}/samples" ]]; then
            echo "error: samples directory not found under SPACEMIT_ORT_DIR: ${SPACEMIT_ORT_DIR}/samples" >&2
            exit 1
          fi

          echo "Using SPACEMIT_ORT_DIR=${SPACEMIT_ORT_DIR}"
          rm -rf build/CMakeCache.txt
          cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_CPU_RISCV64_SPACEMIT=ON \
              -DGGML_CPU_REPACK=OFF \
              -DGGML_OPENMP=OFF \
              -DLLAMA_CURL=OFF \
              -DGGML_RVV=ON \
              -DGGML_RV_ZVFH=ON \
              -DGGML_RV_ZFH=ON \
              -DGGML_RV_ZICBOP=ON \
              -DGGML_RV_ZIHINTPAUSE=ON \
              -DGGML_RV_ZBA=ON \
              -DCMAKE_INSTALL_PREFIX=build/installed \
              -DCMAKE_TOOLCHAIN_FILE=${PWD}/cmake/riscv64-spacemit-linux-gnu-gcc.cmake \
              -DLLAMA_SERVER_SMT_VISION=ON \
              -DSPACEMIT_ORT_DIR=${SPACEMIT_ORT_DIR}

          cmake --build build --parallel "$(nproc)" --config Release

          pushd build >/dev/null
          make install
          popd >/dev/null

      - name: Pack artifacts
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && steps.release_guard.outputs.should_publish == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="release/${SPACEMIT_MTMD_PACKAGE_NAME}"
          ASSET_NAME="${SPACEMIT_MTMD_PACKAGE_NAME}.tar.gz"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          cp -a build/installed/. "$PACKAGE_DIR/"
          cp LICENSE README.md VERSION_NUMBER "$PACKAGE_DIR/"

          if [[ -d "$PACKAGE_DIR/bin" ]]; then
            find "$PACKAGE_DIR/bin" -maxdepth 1 \( -type f -o -type l \) \( -name 'test*' -o -name 'export-graph-ops*' \) -exec rm -f {} +
          fi

          tar -czf "release/${ASSET_NAME}" -C release "${SPACEMIT_MTMD_PACKAGE_NAME}"

      - name: Inspect package
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && steps.release_guard.outputs.should_publish == 'true') }}
        shell: bash
        run: |
          set -euo pipefail

          ASSET_NAME="${SPACEMIT_MTMD_PACKAGE_NAME}.tar.gz"
          echo "Package tree:"
          find "release/${SPACEMIT_MTMD_PACKAGE_NAME}" -maxdepth 2 -print | sort
          echo "Package archive:"
          tar -tzf "release/${ASSET_NAME}"

      - name: Upload package for PR inspection
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: spacemit-mtmd-package
          path: release/${{ steps.vars.outputs.package_name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' && steps.release_guard.outputs.should_publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: ${{ steps.vars.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: release/${{ steps.vars.outputs.package_name }}.tar.gz
          body: |
            SpacemiT MTMD build for `spacemit-mtmd`.
            Version: `${{ steps.vars.outputs.version_number }}`
            Package: `${{ steps.vars.outputs.package_name }}.tar.gz`
            Commit: `${{ github.sha }}`
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
